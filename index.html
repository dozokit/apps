<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Dozokit Apps</title>
    <link rel="stylesheet" href="https://fonts.bunny.net/css?family=public-sans:700|fraunces:600|archivo:800|sora:600&display=swap" />
    <style>
      :root { --paper: #f6f1ec; --ink: #2a2421; --muted: #6b625c; --line: #ddd3ca; --bad: #a3261b; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: var(--ink); background: var(--paper); }
      main { max-width: 46rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
      main.wide { max-width: none; padding: 1rem; }
      h1 { font-size: 1.5rem; margin: 0 0 1rem; } h2 { font-size: 1.1rem; margin: 2rem 0 .5rem; }
      section { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.25rem; margin: 1rem 0; }
      input, button { font: inherit; padding: .5rem .8rem; border-radius: 8px; border: 1px solid var(--ink); }
      input { background: #fff; min-width: 0; }
      button, .btn { background: var(--ink); color: #fff; border: 1px solid var(--ink); cursor: pointer; text-decoration: none; display: inline-block; padding: .5rem .9rem; border-radius: 8px; }
      button.line { background: none; color: var(--ink); }
      button:disabled { opacity: .45; cursor: default; }
      .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
      .grow { flex: 1; }
      .muted { color: var(--muted); font-size: .95rem; } .error { color: var(--bad); white-space: pre-wrap; } .ok { color: #1f6b3a; }
      ul.apps { list-style: none; padding: 0; margin: 0; } ul.apps li { padding: .6rem 0; border-top: 1px solid var(--line); } ul.apps li:first-child { border-top: 0; }
      code { background: #efe7df; padding: .1rem .3rem; border-radius: 4px; word-break: break-all; }
      iframe { width: 100%; height: calc(100vh - 13rem); min-height: 24rem; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
      a { color: inherit; }
      .usage { display: grid; gap: .1rem; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: .7rem 1rem; margin: .5rem 0 1rem; }
      .usage p { margin: 0; } .usage .warn { color: #8a4b00; font-weight: 600; }
      .themes { border: 0; padding: 0; margin: 0 0 1rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr)); gap: .6rem; }
      .themes legend { font-weight: 600; margin-bottom: .4rem; }
      .themes label { display: grid; gap: .3rem; justify-items: start; cursor: pointer; font-size: .95rem; }
      .themes input { position: absolute; opacity: 0; }
      .swatch { width: 100%; height: 3.6rem; border: 1px solid var(--line); border-radius: 8px; display: flex; align-items: center; justify-content: space-between; padding: 0 .7rem; font-size: 1.35rem; font-weight: 700; }
      .swatch i { width: 1.1rem; height: 1.1rem; border-radius: 50%; }
      .themes label.picked .swatch { outline: 2px solid var(--ink); outline-offset: 2px; }
      .themes input:focus-visible + .swatch { outline: 2px solid var(--ink); outline-offset: 4px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
